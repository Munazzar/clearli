name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright (tests load it from /opt/node22, like the dev sandbox)
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
          sudo mkdir -p /opt/node22/lib/node_modules
          sudo ln -s "$PWD/node_modules/playwright" /opt/node22/lib/node_modules/playwright
      - name: Run tests
        run: bash test/run-all.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: test/shots
