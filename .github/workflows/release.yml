# Builds the signed Android APK and attaches it to a GitHub release.
# Run it from Actions → "Release APK" → Run workflow, or push a tag like v1.5.0.
# One-time secrets (Settings → Secrets and variables → Actions):
#   KEYSTORE_BASE64   base64 of release.keystore   (e.g. `base64 -w0 release.keystore`) — the SAME key as 1.4.0
#   KEYSTORE_PASS     its password
#   GOOGLE_APP_CLIENT_SECRET   the Desktop OAuth client's secret
# and variable GOOGLE_APP_CLIENT_ID (the Desktop OAuth client ID).
name: Release APK
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Android build tools
        run: sudo apt-get update -q && sudo apt-get install -y -q android-sdk-platform-23 aapt apksigner zipalign dalvik-exchange openjdk-17-jdk-headless
      - name: Restore release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          [ -n "$KEYSTORE_BASE64" ] || { echo "Add the KEYSTORE_BASE64 secret (the 1.4.0 release key) first"; exit 1; }
          echo "$KEYSTORE_BASE64" | base64 -d > release.keystore
      - name: Build
        env:
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          GOOGLE_APP_CLIENT_ID: ${{ vars.GOOGLE_APP_CLIENT_ID }}
          GOOGLE_APP_CLIENT_SECRET: ${{ secrets.GOOGLE_APP_CLIENT_SECRET }}
        run: |
          bash build.sh
          # refuse to publish an APK signed with any key other than the 1.4.0 one (updates would not install)
          apksigner verify --print-certs build/Clearli.apk | grep -i 'SHA-256 digest: 45340877' || { echo "Wrong signing key"; exit 1; }
          rm -f release.keystore
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=$(grep -o 'versionName="[^"]*"' android/AndroidManifest.xml | cut -d'"' -f2)
          cp build/Clearli.apk "Clearli-$V.apk"
          gh release view "v$V" >/dev/null 2>&1 || gh release create "v$V" --title "Clearli $V" --notes "Sign in with Google on the web or the app; everything syncs through your own Google Drive. Bank-file import for any country. SimpleFIN syncs only while signed in." --target "$GITHUB_SHA"
          gh release upload "v$V" "Clearli-$V.apk" --clobber
